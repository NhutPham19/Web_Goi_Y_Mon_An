services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: web_nauan_backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web_nauan_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
